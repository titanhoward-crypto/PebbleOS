# Put this file at:  .github/workflows/build-iso.yml
# Builds the PebbleOS ISO on GitHub's servers (no WSL needed).
# Run it from the repo's "Actions" tab -> "Build PebbleOS ISO" -> "Run workflow",
# or push a tag like v0.1 to also publish the ISO as a GitHub Release.

name: Build PebbleOS ISO

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Package set (1 = minimal ... 4 = everything)"
        type: choice
        default: "4"
        options: ["1", "2", "3", "4"]
  push:
    tags: ["v*"]

permissions:
  contents: write        # lets the tag build attach the ISO to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Reuses build_iso.py's cleanup: exec bits, CRLF->LF, one package list,
      # invalid package names dropped/replaced, wallpaper. No WSL needed for this part.
      - name: Prepare source
        run: |
          mkdir -p /tmp/prep
          python3 build_iso.py . --prepare-only -o /tmp/prep --stage "${{ inputs.stage || '4' }}"

      # /mnt is the runner's big (~70 GB) scratch disk. Debian's own live-build runs
      # inside a privileged Debian container (Ubuntu's live-build is an older fork).
      - name: Build ISO (Debian bookworm container)
        run: |
          sudo mkdir -p /mnt/pebble/out
          sudo cp /tmp/prep/pebbleos-prepared.tar /mnt/pebble/
          sudo docker run --rm --privileged -v /mnt/pebble:/work debian:bookworm bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends live-build debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools isolinux syslinux syslinux-common gpgv ca-certificates debian-archive-keyring
            mkdir /work/build
            tar -xf /work/pebbleos-prepared.tar -C /work/build
            cd /work/build
            DISTRO=bookworm ARCH=amd64 bash scripts/configure.sh
            lb build 2>&1 | tee /work/out/build.log
            cp live-image-*.iso /work/out/pebbleos.iso
          '

      - name: Checksum
        run: |
          sudo chown -R "$USER" /mnt/pebble/out
          cd /mnt/pebble/out
          sha256sum pebbleos.iso | tee pebbleos.iso.sha256
          ls -lh

      - name: Upload ISO as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: pebbleos-iso
          path: |
            /mnt/pebble/out/pebbleos.iso
            /mnt/pebble/out/pebbleos.iso.sha256
          compression-level: 0
          retention-days: 14

      - name: Keep the build log if the build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /mnt/pebble/out/build.log
          if-no-files-found: ignore

      # GitHub Releases cap each file at 2 GiB, so big ISOs are split into parts.
      - name: Split ISO for release if needed
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd /mnt/pebble/out
          if [ "$(stat -c%s pebbleos.iso)" -gt 2000000000 ]; then
            split -b 1900M -d pebbleos.iso pebbleos.iso.part
            rm pebbleos.iso
            echo "ISO was split. Rejoin on Windows:  copy /b pebbleos.iso.part00+pebbleos.iso.part01 pebbleos.iso"
          fi

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /mnt/pebble/out/pebbleos.iso*
