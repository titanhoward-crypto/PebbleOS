set default=0
set timeout=5
set timeout_style=menu

# Simple PebbleOS branding
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm

# Background (if a splash image is placed at boot/grub/splash.png it will be used)
if [ -f /boot/grub/splash.png ]; then
  background_image /boot/grub/splash.png
fi

menuentry "PebbleOS" {
    linux  /live/vmlinuz boot=live components quiet splash hostname=pebbleos username=pebble user-fullname="Pebble User" locales=en_US.UTF-8 keyboard-layouts=us
    initrd /live/initrd.img
}

menuentry "PebbleOS (Failsafe / Safe Mode)" {
    linux  /live/vmlinuz boot=live components memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash vga=normal
    initrd /live/initrd.img
}

menuentry "PebbleOS (Persistence enabled – requires labeled volume)" {
    linux  /live/vmlinuz boot=live components quiet splash persistence hostname=pebbleos username=pebble
    initrd /live/initrd.img
}
